- name: enable nginx 1.26
  command: dnf module enable nginx:1.26 -y

- name: install nginx
  dnf:
    name: nginx
    state: present

- name: start and enable nginx 
  service:
    name: nginx
    state: started
    enabled: yes

# - name: remove default nginx content
#   file:
#     path: /usr/share/nginx/html
#     state: absent

- name: Find all contents inside the directory
  ansible.builtin.find:
    paths: /usr/share/nginx/html
    recurse: yes
    hidden: true
    file_type: any
  register: directory_contents

- name: Print the contents of the directory
  debug:
    msg: "{{ directory_contents}}"

- name: Remove all contents inside the directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ directory_contents.files }}"


- name: download frontend application
  get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/frontend-v4.zip
    dest: /tmp/frontend.zip

- name: unzip frontend
  unarchive:
    src: /tmp/frontend.zip
    dest: /usr/share/nginx/html
    remote_src: yes    

- name: copy roboshop configuration
  template:
    src: roboshop.conf.j2
    dest: /etc/nginx/default.d/roboshop.conf
    notify:
      - restart nginx