- name: application setup
  include_role:
    name: common
    tasks_from: app-setup

- name: install java
  include_role:
    name: common
    tasks_from: java

- name: systemd setup
  include_role:
    name: common
    tasks_from: systemd-setup

- name: check cities data exists or not
  command: mysql -h "{{ mysql_host }}" -uroot -p{{ mysql_root_password }} -N -B -e "SELECT COUNT(*) FROM cities.cities;"
  register: cities_count
  ignore_errors: true
  tags:
    - mysql

- name: print cities count
  debug:
    msg: "{{ cities_count }}"
  tags:
    - mysql

- name: load cities data into mysql
  shell: mysql -h "{{ mysql_host }}" -uroot -p{{ mysql_root_password }} < /app/db/master-data.sql
  when: cities_count.rc != 0 or cities_count.stdout | int == 0
  tags:
    - mysql

- name: create app user in mysql
  shell: mysql -h "{{ mysql_host }}" -uroot -p{{ mysql_root_password }} < /app/db/app-user.sql
  tags:
    - mysql

- name: restart application
  include_role:
    name: common
    tasks_from: restart


  
 